name: build-kdenlive-appimage-arm

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  appimage-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CRAFT_ROOT: ${{ github.workspace }}/CraftRoot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            curl \
            extra-cmake-modules \
            git \
            ninja-build \
            python3 \
            python3-pip \
            python3-venv

      - name: Setup Craft
        run: |
          curl -fsSL https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -o CraftBootstrap.py
          # Select arm64 (option 1) and accept defaults for the rest.
          printf "1\n\n" | python3 CraftBootstrap.py --prefix "$CRAFT_ROOT"
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --version

      - name: Build and package AppImage (ARM64)
        run: |
          source "$CRAFT_ROOT/craft/craftenv.sh"
          craft --target=master --package kdenlive

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-appimage-arm64
          path: CraftRoot/tmp/*.AppImage
