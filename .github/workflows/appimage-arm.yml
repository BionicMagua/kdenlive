name: build-kdenlive-appimage-arm

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  appimage-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CRAFT_ROOT: ${{ github.workspace }}/CraftRoot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base tools
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            extra-cmake-modules \
            git \
            ninja-build \
            python3 \
            python3-pip \
            python3-venv

      - name: Setup Craft
        run: |
          git clone https://invent.kde.org/packaging/craft.git
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r craft/requirements.txt
          echo "${{ github.workspace }}/craft/bin" >> "$GITHUB_PATH"
          craft --version

      - name: Build and package AppImage (ARM64)
        run: |
          craft --target=master --package kdenlive

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: kdenlive-appimage-arm64
          path: CraftRoot/tmp/*.AppImage
